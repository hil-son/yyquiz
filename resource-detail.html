<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>資源詳情</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              yellow: '#f9ed32',
              green: '#5cc5c1',
              teal: '#12c1c3',
              border: '#e1e0d7',
              grey: '#e1e0d7',
            }
          },
          fontFamily: {
            sans: ['"Noto Sans TC"', '"Noto Sans HK"', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    :root { --app-max-width: 100%; }
    @media (min-width: 431px) { :root { --app-max-width: 430px; } }
    body {
      font-family: 'Noto Sans TC', 'Noto Sans HK', sans-serif;
      margin: 0;
    }
    .page-shell {
      width: 100%;
      max-width: var(--app-max-width);
      margin-inline: auto;
    }
    .resource-tag {
      display: inline-flex;
      align-items: center;
      border-radius: 9999px;
      padding: 2px 10px;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.4;
      white-space: nowrap;
    }
    .resource-tag--subject {
      background: #5cc5c1;
      color: #fff;
    }
    .resource-tag--tutor {
      border: 1px solid #5cc5c1;
      color: #5cc5c1;
      background: #fff;
    }
    .resource-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
  </style>
</head>
<body class="bg-white text-black antialiased">
  <div class="page-shell">
    <header class="flex items-center gap-3 px-4 py-4">
      <a href="index.html#resource-library" class="flex h-10 w-10 items-center justify-center rounded-full border border-brand-green text-brand-green no-underline" aria-label="返回">
        ‹
      </a>
      <h1 class="text-[18px] font-bold text-brand-green">資源詳情</h1>
    </header>

    <main id="resource-detail" class="px-5 pb-10">
      <p class="text-[14px] text-[#818181]">載入中…</p>
    </main>
  </div>

  <script src="resources-data.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const container = document.getElementById('resource-detail');
      const resource = RESOURCES.find((item) => item.id === id);

      if (!resource) {
        container.innerHTML = '<p class="text-[16px] text-[#818181]">找不到此資源。</p>';
        return;
      }

      document.title = resource.title;

      container.innerHTML = `
        <div class="rounded-[20px] border border-brand-border bg-white p-5">
          <div class="mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-[#eefaf9] text-brand-green">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M6 4h12v2H6V4zm0 4h12v12H6V8zm2 2v8h8v-8H8z"/>
            </svg>
          </div>
          <h2 class="text-[20px] font-bold leading-7 text-[#282828]">${resource.title}</h2>
          <div class="resource-tags mt-4">
            ${resource.subjects.map((s) => `<span class="resource-tag resource-tag--subject">${s}</span>`).join('')}
            ${resource.tutors.map((t) => `<span class="resource-tag resource-tag--tutor">${t}</span>`).join('')}
          </div>
          <p class="mt-4 text-[14px] text-[#818181]">${resource.date}</p>
        </div>
      `;
    })();
  </script>
</body>
</html>
